<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./main/js" defer></script>
    <title>Carrito de compras</title>
    <style>
        body {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 16px;
            font-family: Arial, sans-serif;
        }

        .producto {
            margin: 10px 0;
            padding: 12px;
            border: 1px solid #cccccc;
        }

        button {
            margin-left: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Tienda</h1>

    <h2>Productos</h2>
    <div class="producto">
        <h3>Cuaderno</h3>
        <p>Precio: $1500</p>
        <button class="agregar" data-id="1" data-nombre="Cuaderno" data-precio="1500">
            Agregar al carrito
        </button>
    </div>

    <div class="producto">
        <h3>Lápiz</h3>
        <p>Precio: $500</p>
        <button class="agregar" data-id="2" data-nombre="Lápiz" data-precio="500">
            Agregar al carrito
        </button>
    </div>

    <div class="producto">
        <h3>Mochila</h3>
        <p>Precio: $12000</p>
        <button class="agregar" data-id="3" data-nombre="Mochila" data-precio="12000">
            Agregar al carrito
        </button>
    </div>

    <h2>Mi carrito</h2>
    <ul id="lista-carrito"></ul>
    <p>Total: $<span id="total-carrito">0</span></p>
</body>
</html>
